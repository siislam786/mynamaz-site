<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 54" width="180" height="54" role="img" aria-label="Get it on Google Play">
  <rect x="0.5" y="0.5" width="179" height="53" rx="9" ry="9" fill="#000000" stroke="#A6A6A6" stroke-width="1"/>
  <!-- Google Play triangle: four facets meeting at a central junction K.
       Top-left green, bottom-left blue, top-right red, bottom-right yellow. -->
  <g>
    <polygon points="15,15 15,27 24,27" fill="#00D95F"/>
    <polygon points="15,27 15,39 24,27" fill="#00A0FF"/>
    <polygon points="15,15 24,27 37,27" fill="#FF3B30"/>
    <polygon points="15,39 24,27 37,27" fill="#FFCE45"/>
  </g>
  <text x="48" y="23" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="1.2">GET IT ON</text>
  <text x="47.4" y="41" fill="#FFFFFF" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="0.2">Google Play</text>
</svg>
